name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.99.1", "1.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y expect fd-find ripgrep
      - run: sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - run: npm install -g @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
